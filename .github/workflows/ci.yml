# Continuous Integration (Blueprint §9.2, ADR-012)
#
# Job design follows one rule: fail fast on cheap checks, and never let an
# expensive job mask a trivial failure.
#
# Phase 2 adds Deno lint/typecheck/test to the `quality` job now that real
# source exists under supabase/functions/ — running them against an empty
# glob (Phase 1) would have errored or passed vacuously, neither of which is
# a real gate.
#
# Phase 3 adds the `database` job: starts the local Supabase stack (the only
# place this project runs Docker — ADR-011), applies every migration and
# supabase/seed.sql from a clean database, then runs the Vitest database
# suite against it (Blueprint §13.5 specifies Vitest, not pgTAP, for the
# garden derivation functions). It also adds `tsc --noEmit` to the `quality`
# job's Typecheck step, since that suite is the first Node-side (not Deno)
# TypeScript in the repo.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes an in-flight run — GitHub Actions
# free minutes are a budgeted resource (Blueprint Appendix C).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install tooling
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: deno fmt --check supabase/functions/ && npx prettier --check .

      - name: Lint
        run: deno lint supabase/functions/ && npx eslint .

      # Type checking is a separate step from tests so a type regression is
      # reported as such, rather than surfacing as an opaque test failure.
      - name: Typecheck
        run: deno check supabase/functions/**/*.ts && npx tsc --noEmit

      - name: Unit tests
        run: deno test --allow-env --allow-read --no-check=remote supabase/functions/

  database:
    name: Database schema, RLS, garden engine
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install tooling
        run: npm ci --no-audit --no-fund

      # ubuntu-latest ships Docker preinstalled and running — the one
      # environment where this project's only Docker usage (ADR-011) needs
      # no extra setup.
      - name: Start local Supabase stack
        run: npx supabase start

      # `-o env` is the CLI's documented machine-readable output for exactly
      # this use case, but it emits shell-quoted KEY="value" pairs meant to be
      # eval'd/sourced, not appended verbatim to $GITHUB_ENV (which does no
      # quote-stripping of its own -- a raw append leaves literal quote
      # characters inside the value, e.g. API_URL becomes the 22-character
      # string `"http://127.0.0.1:54321"` instead of a valid URL). `eval` lets
      # the shell do the quote handling correctly, then the values are
      # re-exported under this suite's own variable names.
      - name: Export local stack credentials
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DATABASE_URL=$DB_URL"
          } >> "$GITHUB_ENV"

      # invoke_edge_function() (migration 0011) reads the service-role key
      # from Supabase Vault, never from a plain table -- this is the local
      # stack's one-time equivalent of the manual per-environment step
      # documented in that migration, using the real key this job already
      # captured above rather than a hardcoded/guessed value anywhere.
      # ubuntu-latest ships `psql` preinstalled.
      - name: Seed the local Vault secret for cron-triggered Edge Functions
        run: |
          psql "$DATABASE_URL" -c "SELECT vault.create_secret('$SUPABASE_SERVICE_ROLE_KEY', 'service_role_key');"

      - name: Lint schema
        run: npm run db:lint

      - name: Run database test suite
        run: npm run test:db

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # frontend/ is a separate Vite/React project with its own toolchain
    # (root eslint.config.js and .prettierignore both exclude it deliberately
    # -- see their own comments) -- own install, own checks, no dependency on
    # the root `quality` job's npm ci.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install tooling
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      # Unit tests (Vitest + Testing Library) mock the Supabase client
      # entirely -- no live project or Docker needed, unlike frontend-e2e
      # below. Placeholder VITE_ values satisfy lib/env.ts's fail-fast check
      # at import time (vitest.config.ts's test.env already sets these for
      # local runs; CI needs them too since this step runs outside Vitest).
      - name: Unit tests
        run: npm test
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      # No VITE_SUPABASE_URL/VITE_SUPABASE_ANON_KEY secrets configured here --
      # lib/env.ts throws at import time without them, which would fail this
      # step immediately. Placeholder values are enough to prove the bundle
      # itself builds correctly; runtime behaviour against a real project is
      # not what this step verifies.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  frontend-e2e:
    name: Frontend E2E (Playwright, real local Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Root-level Supabase CLI (same one the `database` job uses), not
      # frontend/'s own npm install -- the local stack is project-wide
      # infrastructure, unrelated to which package happens to consume it.
      - name: Install root tooling (Supabase CLI)
        run: npm ci --no-audit --no-fund

      - name: Start local Supabase stack
        run: npx supabase start

      # See the `database` job's identical step for why `eval` is used
      # instead of appending supabase status -o env's output directly.
      - name: Export local stack credentials as Vite env vars
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
          } >> "$GITHUB_ENV"

      - name: Install frontend tooling
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright's Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the pre-commit hook covers staged changes, but only a
          # complete scan catches a secret committed before the hook existed or
          # pushed with --no-verify (Blueprint §7.5).
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
